<script>
/* ============================================================
   PCM DE FERRAMENTAS — JavaScript v2.5 (corrigido)
   Correções aplicadas:
   ✅ Parar câmera/scanner ao fechar dialog (ESC)
   ✅ OCR corrigido (tipoServicoFora / tipoAssistFora)
   ✅ Compressão de imagens antes de salvar (evita estourar localStorage)
   ✅ Validação de duplicata em manutenção/ativos/criados/pedidos
   ✅ Filtro "Atrasadas" robusto
   ✅ Botão "Reabrir" para itens retornados
   ✅ Toast em vez de alert (feedback não-bloqueante)
   ✅ Aviso de armazenamento cheio
   ✅ Filtro por data no histórico
   ✅ escapar() seguro com textContent
   ✅ Wizard de alarme mais robusto
   ============================================================ */

/* ============ ESTADO GLOBAL ============ */
const SETORES_PADRAO = ["Acabamento 01","Acabamento 02","Laminação 01","Laminação 02","Marcenaria","CNC","Tecelagem","Manutenção","Almoxarifado","Compras"];

let setores = (() => {
  try {
    const s = JSON.parse(localStorage.getItem("controleSetores") || "null");
    if(Array.isArray(s) && s.length) return s;
  } catch(e){}
  return SETORES_PADRAO.map(nome => ({ nome, observacoes: "" }));
})();

function carregarArray(chave){
  try {
    const v = JSON.parse(localStorage.getItem(chave) || "[]");
    return Array.isArray(v) ? v : [];
  } catch(e){ return []; }
}

let ferramentas = carregarArray("controleFerramentas");
let manutencoes = carregarArray("controleManutencoes");
let ativos = carregarArray("controleAtivos");
let ativosCriados = carregarArray("controleAtivosCriados");
let pedidosMateriais = carregarArray("controlePedidosMateriais");
let manutencoesExternas = carregarArray("controleManutencoesExternas");
let foraDaEmpresa = carregarArray("controleForaDaEmpresa");
let historico = carregarArray("controleHistorico");
let alarmes = carregarArray("controleAlarmes");

let usuarioAtual = localStorage.getItem("controleUsuario") || "";

let contadores = (() => {
  try {
    const c = JSON.parse(localStorage.getItem("controleContadores") || '{"FER":0,"AT":0,"CR":0,"PED":0,"EXT":0,"MAN":0,"FORA":0}');
    return (c && typeof c === "object") ? c : {FER:0,AT:0,CR:0,PED:0,EXT:0,MAN:0,FORA:0};
  } catch(e){
    return {FER:0,AT:0,CR:0,PED:0,EXT:0,MAN:0,FORA:0};
  }
})();

let filtroAtualFerramenta = "todas";
let filtroAtualManutencao = "todas";
let filtroAtualFora = "todas";

let midiasFerramenta = [];
let midiasManutencao = [];
let midiasAtivo = [];
let midiasFora = [];

let cameraStream = null;
let cameraDestino = "ferramenta";
let scanner = null;
let scannerNFCe = null;
let graficoStatus = null;
let graficoSetores = null;

/* ============ HELPERS ============ */
function escapar(t=""){
  const div = document.createElement("div");
  div.textContent = String(t == null ? "" : t);
  return div.innerHTML;
}

function gerarId(){
  return Date.now().toString(36) + Math.random().toString(36).substr(2,6);
}

function gerarCodigo(prefixo){
  if(!contadores[prefixo]) contadores[prefixo] = 0;
  contadores[prefixo]++;
  return `${prefixo}-${String(contadores[prefixo]).padStart(3,"0")}`;
}

function toast(msg, tipo = "info"){
  const t = document.createElement("div");
  t.className = `toast toast-${tipo}`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => {
    t.style.opacity = "0";
    t.style.transition = "opacity 0.3s";
    setTimeout(() => t.remove(), 350);
  }, 3000);
}

function sincronizarGlobais(){
  window.ferramentas = ferramentas;
  window.manutencoes = manutencoes;
  window.ativos = ativos;
  window.ativosCriados = ativosCriados;
  window.pedidosMateriais = pedidosMateriais;
  window.manutencoesExternas = manutencoesExternas;
  window.foraDaEmpresa = foraDaEmpresa;
  window.alarmes = alarmes;
  window.setores = setores;
  window.usuarioAtual = usuarioAtual;
}

function salvarBanco(){
  sincronizarGlobais();
  try {
    localStorage.setItem("controleFerramentas", JSON.stringify(ferramentas));
    localStorage.setItem("controleManutencoes", JSON.stringify(manutencoes));
    localStorage.setItem("controleAtivos", JSON.stringify(ativos));
    localStorage.setItem("controleAtivosCriados", JSON.stringify(ativosCriados));
    localStorage.setItem("controlePedidosMateriais", JSON.stringify(pedidosMateriais));
    localStorage.setItem("controleManutencoesExternas", JSON.stringify(manutencoesExternas));
    localStorage.setItem("controleForaDaEmpresa", JSON.stringify(foraDaEmpresa));
    localStorage.setItem("controleHistorico", JSON.stringify(historico));
    localStorage.setItem("controleAlarmes", JSON.stringify(alarmes));
    localStorage.setItem("controleSetores", JSON.stringify(setores));
    localStorage.setItem("controleContadores", JSON.stringify(contadores));
    localStorage.setItem("controleUsuario", usuarioAtual);
  } catch(e){
    console.error("Erro ao salvar:", e);
    if(e.name === "QuotaExceededError" || (e.message && e.message.toLowerCase().includes("quota"))){
      toast("⚠️ Armazenamento cheio! Exporte um backup e remova fotos antigas.", "error");
    } else {
      toast("❌ Erro ao salvar: " + e.message, "error");
    }
  }
}

function registrarHistorico(nome, acao){
  const user = usuarioAtual ? `[${usuarioAtual}]` : "[—]";
  historico.push({
    nome,
    acao: `${user} ${acao}`,
    data: new Date().toISOString(),
    usuario: usuarioAtual || "—"
  });
  if(historico.length > 1000) historico.shift();
  salvarBanco();
}

function verificarArmazenamento(){
  try {
    let total = 0;
    for(let k in localStorage){
      if(Object.prototype.hasOwnProperty.call(localStorage, k)){
        total += (localStorage[k] || "").length;
      }
    }
    const mb = total / 1024 / 1024;
    const aviso = document.getElementById("avisoArmazenamento");
    if(aviso){
      if(mb > 4){
        aviso.style.display = "block";
        aviso.innerHTML = `⚠️ <b>Armazenamento em ${mb.toFixed(1)}MB de ~5MB.</b> Exporte um backup e remova fotos antigas para liberar espaço.`;
      } else {
        aviso.style.display = "none";
      }
    }
    return mb;
  } catch(e){ return 0; }
}

function comprimirImagem(dataUrl, maxW = 1000, qualidade = 0.75){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        let w = img.width, h = img.height;
        if(w > maxW){ h = (maxW / w) * h; w = maxW; }
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", qualidade));
      } catch(e){ resolve(dataUrl); }
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* ============ USUÁRIO ============ */
function trocarUsuario(){
  const el = document.getElementById("nomeUsuarioInput");
  if(el) el.value = usuarioAtual;
  const dlg = document.getElementById("dialogUsuario");
  if(dlg) dlg.showModal();
}
function salvarUsuario(){
  const nome = document.getElementById("nomeUsuarioInput").value.trim();
  if(!nome){ toast("Digite um nome.", "error"); return; }
  usuarioAtual = nome;
  window.usuarioAtual = nome;
  localStorage.setItem("controleUsuario", nome);
  document.getElementById("usuarioAtual").textContent = `👤 ${nome}`;
  document.getElementById("dialogUsuario").close();
  registrarHistorico(nome, "entrou no sistema");
  toast(`Bem-vindo, ${nome}!`, "success");
}

/* ============ TEMA ============ */
function alternarTema(){
  document.body.classList.toggle("tema-claro");
  const claro = document.body.classList.contains("tema-claro");
  localStorage.setItem("controleTema", claro ? "claro" : "escuro");
  document.getElementById("btnTema").textContent = claro ? "🌙" : "☀️";
  mostrarTudo();
}

/* ============ INIT ============ */
function iniciar(){
  if(localStorage.getItem("controleTema") === "claro"){
    document.body.classList.add("tema-claro");
    document.getElementById("btnTema").textContent = "🌙";
  }
  if(usuarioAtual){
    document.getElementById("usuarioAtual").textContent = `👤 ${usuarioAtual}`;
  } else {
    setTimeout(()=>{ if(!usuarioAtual) trocarUsuario(); }, 800);
  }
  atualizarSelectsSetores();

  const hoje = new Date().toISOString().substring(0,10);
  const dP = document.getElementById("dataPedido"); if(dP) dP.value = hoje;
  const dC = document.getElementById("dataCriado"); if(dC) dC.value = hoje;
  const dM = document.getElementById("dataEntradaManutencao"); if(dM) dM.value = hoje;
  const dF = document.getElementById("dataSaidaFora"); if(dF) dF.value = hoje;

  document.querySelectorAll("#navPrincipal button").forEach(botao=>{
    botao.onclick = function(){
      document.querySelectorAll("#navPrincipal button").forEach(b=>b.classList.remove("ativo"));
      this.classList.add("ativo");
      document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
      const alvo = document.getElementById(this.dataset.tela);
      if(alvo) alvo.classList.remove("hidden");
      mostrarTudo();
    };
  });

  // ✅ FIX: para streams de câmera/scanner quando dialog fecha (ESC inclusive)
  ["dialogCamera","dialogScanner","dialogScannerNFCe"].forEach(id=>{
    const dlg = document.getElementById(id);
    if(!dlg) return;
    dlg.addEventListener("close", ()=>{
      if(cameraStream){
        cameraStream.getTracks().forEach(t=>t.stop());
        cameraStream = null;
      }
      if(scanner){
        try { scanner.stop().then(()=>scanner.clear()).catch(()=>{}); } catch(e){}
        scanner = null;
      }
      if(scannerNFCe){
        try { scannerNFCe.stop().then(()=>scannerNFCe.clear()).catch(()=>{}); } catch(e){}
        scannerNFCe = null;
      }
    });
  });

  atualizarStatusRede();
  setInterval(verificarAlarmes, 60000);
  setTimeout(verificarAlarmes, 1000);
  mostrarTudo();
  verificarArmazenamento();
}

function atualizarSelectsSetores(){
  const opts = setores.map(s => `<option>${escapar(s.nome)}</option>`).join("");
  ["setorFerramenta","setorManutencao","setorAtivo","setorCriado","setorPedido","setorFora"].forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const v = el.value;
    el.innerHTML = opts;
    if(v && setores.some(s => s.nome === v)) el.value = v;
  });
}

function mostrarTudo(){
  sincronizarGlobais();
  const fns = [
    mostrarEstatisticas, mostrarGraficos, mostrarSetores, mostrarFerramentas,
    mostrarManutencoes, mostrarForaDaEmpresa, mostrarAtivos, mostrarCriados,
    mostrarPedidos, mostrarManutencoesExternas, mostrarHistorico
  ];
  fns.forEach(fn => { try { fn(); } catch(e){ console.warn(fn.name, e); } });
  atualizarBadgeAlarme();
  atualizarBadgeFora();
  verificarArmazenamento();
}

/* ============ GRÁFICOS ============ */
function mostrarGraficos(){
  if(!window.Chart) return;
  const claro = document.body.classList.contains("tema-claro");
  const corTexto = claro ? "#0a1a2e" : "#ffffff";

  const ctx1 = document.getElementById("graficoStatus");
  if(ctx1){
    const disp = ferramentas.filter(x=>x.status==="Disponível").length;
    const emp = ferramentas.filter(x=>x.status==="Emprestada").length;
    const man = ferramentas.filter(x=>x.status==="Manutenção").length;
    if(graficoStatus) graficoStatus.destroy();
    graficoStatus = new Chart(ctx1, {
      type: "doughnut",
      data: { labels: ["Disponíveis","Emprestadas","Manutenção"], datasets: [{ data: [disp, emp, man], backgroundColor: ["#2ddb7a","#ffd14a","#ff6b82"], borderWidth: 0 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: corTexto, font: { size: 12 } } } } }
    });
  }

  const ctx2 = document.getElementById("graficoSetores");
  if(ctx2){
    const dados = setores.map(s => {
      const f = ferramentas.filter(x=>x.setor===s.nome).length;
      const m = manutencoes.filter(x=>x.setor===s.nome).length;
      const a = ativos.filter(x=>x.setor===s.nome).length;
      return { nome: s.nome, total: f+m+a };
    }).sort((a,b)=>b.total-a.total).slice(0,6);
    if(graficoSetores) graficoSetores.destroy();
    graficoSetores = new Chart(ctx2, {
      type: "bar",
      data: { labels: dados.map(d=>d.nome), datasets: [{ label: "Itens", data: dados.map(d=>d.total), backgroundColor: ["#1eb8c9","#7c5cbf","#ff6b9d","#f5a623","#2ddb7a","#6ae2ef"], borderRadius: 8 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: corTexto, font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: corTexto }, grid: { color: "rgba(128,128,128,0.15)" }, beginAtZero: true } } }
    });
  }
}

/* ============ SETORES ============ */
function gerarSetoresHTML(){
  if(!setores.length){
    return `<div class="card empty-state"><span class="emoji">📍</span><span>Nenhum setor cadastrado.</span><button type="button" class="btn-primary mt-16" onclick="abrirSetorNovo()">＋ Criar primeiro setor</button></div>`;
  }
  return setores.map(s => {
    const nome = s.nome;
    const ferr = ferramentas.filter(x => x.setor === nome);
    const manut = manutencoes.filter(x => x.setor === nome);
    const ativ = ativos.filter(x => x.setor === nome);
    const cri = ativosCriados.filter(x => x.setor === nome);
    const ped = pedidosMateriais.filter(x => x.setor === nome);
    const fora = foraDaEmpresa.filter(x => x.setor === nome);
    const total = ferr.length + manut.length + ativ.length + cri.length + ped.length + fora.length;
    const temObs = s.observacoes && s.observacoes.trim().length > 0;
    const idSeguro = "setor_" + btoa(unescape(encodeURIComponent(nome))).replace(/=/g,"");
    return `
      <div class="card setor-card" onclick="abrirSetorPorIndice('${idSeguro}')" style="cursor:pointer;">
        <h3>📍 ${escapar(nome)}</h3>
        <div class="count">${total}</div>
        <div style="font-size:12px;color:var(--cinza);opacity:0.6;text-transform:uppercase;">itens no total</div>
        <div class="tags" style="margin-top:8px;">
          <span class="badge badge-success">🟢 ${ferr.filter(x => x.status === "Disponível").length}</span>
          <span class="badge badge-warning">📤 ${ferr.filter(x => x.status === "Emprestada").length}</span>
          <span class="badge badge-manutencao">🧰 ${manut.length}</span>
          <span class="badge badge-fora">☠️ ${fora.length}</span>
          <span class="badge badge-info">🏭 ${ativ.length}</span>
          <span class="badge badge-created">🔨 ${cri.length}</span>
          <span class="badge badge-pedido">📦 ${ped.length}</span>
        </div>
        ${temObs ? `<div style="margin-top:10px;padding:8px 10px;background:rgba(255,209,74,0.08);border-left:3px solid var(--amarelo);border-radius:8px;font-size:11.5px;color:var(--amarelo);text-align:left;line-height:1.4;">📝 ${escapar(s.observacoes).substring(0,80)}${s.observacoes.length > 80 ? '...' : ''}</div>` : ''}
        <div style="margin-top:10px;font-size:10px;color:var(--cinza);opacity:.4;text-transform:uppercase;letter-spacing:1px;">👆 Toque para editar</div>
      </div>
    `;
  }).join("");
}

function abrirSetorPorIndice(idSeguro){
  const idx = setores.findIndex(s => {
    const id = "setor_" + btoa(unescape(encodeURIComponent(s.nome))).replace(/=/g,"");
    return id === idSeguro;
  });
  if(idx >= 0) abrirSetor(setores[idx].nome);
}

function mostrarSetores(){
  const html = gerarSetoresHTML();
  const a = document.getElementById("cartoesSetores"); if(a) a.innerHTML = html;
  const b = document.getElementById("mapaSetores"); if(b) b.innerHTML = html;
}

function abrirSetor(nomeOriginal){
  const s = setores.find(x => x.nome === nomeOriginal);
  if(!s) return;
  document.getElementById("tituloSetor").textContent = "📍 Editar Setor";
  document.getElementById("idSetorOriginal").value = nomeOriginal;
  document.getElementById("nomeSetor").value = s.nome;
  document.getElementById("obsSetor").value = s.observacoes || "";
  document.getElementById("formAdicionarFerramenta").classList.add("hidden");
  const outros = setores.filter(x => x.nome !== nomeOriginal);
  document.getElementById("moverParaSetor").innerHTML = outros.length ? outros.map(x => `<option>${escapar(x.nome)}</option>`).join("") : `<option value="">(Nenhum outro setor)</option>`;
  document.getElementById("acoesExclusaoSetor").classList.toggle("hidden", !outros.length);
  renderizarFerramentasDoSetor(nomeOriginal);
  document.getElementById("dialogSetor").showModal();
}

function abrirSetorNovo(){
  document.getElementById("tituloSetor").textContent = "➕ Novo Setor";
  document.getElementById("idSetorOriginal").value = "";
  document.getElementById("nomeSetor").value = "";
  document.getElementById("obsSetor").value = "";
  document.getElementById("acoesExclusaoSetor").classList.add("hidden");
  document.getElementById("formAdicionarFerramenta").classList.add("hidden");
  document.getElementById("listaFerramentasSetor").innerHTML = `<div class="card empty-state" style="padding:20px;"><span class="emoji" style="font-size:32px;">💾</span><span class="text-sm">Salve o setor primeiro para poder adicionar ferramentas.</span></div>`;
  document.getElementById("dialogSetor").showModal();
}

function fecharSetor(){ document.getElementById("dialogSetor").close(); }

function renderizarFerramentasDoSetor(nomeSetor){
  const el = document.getElementById("listaFerramentasSetor");
  const lista = ferramentas.filter(f => f.setor === nomeSetor);
  if(!lista.length){
    el.innerHTML = `<div class="card empty-state" style="padding:24px;"><span class="emoji" style="font-size:36px;">🔧</span><span class="text-sm">Nenhuma ferramenta neste setor ainda.</span></div>`;
    return;
  }
  el.innerHTML = lista.map(x => {
    const sc = x.status === "Disponível" ? "badge-success" : x.status === "Emprestada" ? "badge-warning" : "badge-manutencao";
    const foto = x.fotos?.[0] ? `<img class="imagem-mini" src="${x.fotos[0]}" style="width:60px;height:50px;">` : `<div class="imagem-placeholder" style="width:60px;height:50px;font-size:22px;">🔧</div>`;
    return `
      <div class="card item" style="grid-template-columns:60px 1fr auto;padding:8px;">
        ${foto}
        <div class="item-info">

function abrirAdicionarFerramentaSetor(){
  const idSetor = document.getElementById("idSetorOriginal").value;
  if(!idSetor){ toast("Salve o setor primeiro.", "warning"); return; }
  document.getElementById("formAdicionarFerramenta").classList.remove("hidden");
  document.getElementById("novaFerrNome").value = "";
  document.getElementById("novaFerrCodigo").value = "";
  document.getElementById("novaFerrStatus").value = "Disponível";
  document.getElementById("novaFerrNome").focus();
}
function cancelarAdicionarFerramenta(){ document.getElementById("formAdicionarFerramenta").classList.add("hidden"); }

function confirmarAdicionarFerramenta(){
  const nomeSetor = document.getElementById("idSetorOriginal").value;
  const nome = document.getElementById("novaFerrNome").value.trim();
  let codigo = document.getElementById("novaFerrCodigo").value.trim();
  const status = document.getElementById("novaFerrStatus").value;

  if(!nome){ toast("Digite o nome da ferramenta.", "error"); return; }
  if(!nomeSetor){ toast("Setor inválido.", "error"); return; }

  if(codigo){
    const dupCod = ferramentas.find(f => String(f.codigo||'').trim().toLowerCase() === codigo.toLowerCase());
    if(dupCod){
      toast(`⚠️ Código "${dupCod.codigo}" já usado por "${dupCod.nome}".`, "warning");
      return;
    }
  }

  const dupNomeSetor = ferramentas.find(f =>
    String(f.nome||'').trim().toLowerCase() === nome.toLowerCase() &&
    String(f.setor||'').trim().toLowerCase() === nomeSetor.toLowerCase()
  );
  if(dupNomeSetor){
    toast(`⚠️ "${dupNomeSetor.nome}" já existe neste setor.`, "warning");
    return;
  }

  if(!codigo) codigo = gerarCodigo("FER");
  const nova = {
    id: gerarId(), nome, codigo, quantidade: 1, setor: nomeSetor, status,
    observacoes: "", fotos: [],
    dataEmprestimo: status === "Emprestada" ? new Date().toISOString() : null,
    dataCriacao: new Date().toISOString()
  };
  ferramentas.push(nova);
  if(status === "Emprestada") iniciarAlarme(nova);
  registrarHistorico(nome, `adicionou ferramenta ao setor ${nomeSetor}`);
  salvarBanco();
  cancelarAdicionarFerramenta();
  renderizarFerramentasDoSetor(nomeSetor);
  mostrarTudo();
  toast("Ferramenta adicionada!", "success");
}

function excluirFerramentaDoSetor(id){
  const f = ferramentas.find(x => x.id === id);
  if(!f) return;
  if(!confirm(`Excluir "${f.nome}" do setor ${f.setor}?`)) return;
  if(f.status === "Emprestada") pararAlarme(id);
  ferramentas = ferramentas.filter(x => x.id !== id);
  registrarHistorico(f.nome, `excluiu ferramenta do setor ${f.setor}`);
  salvarBanco();
  renderizarFerramentasDoSetor(document.getElementById("idSetorOriginal").value);
  mostrarTudo();
  toast("Ferramenta excluída.", "success");
}

function moverFerramenta(id){
  const f = ferramentas.find(x => x.id === id);
  if(!f) return;
  const outros = setores.filter(s => s.nome !== f.setor);
  if(!outros.length){ toast("Não há outro setor disponível.", "warning"); return; }
  const nomes = outros.map(s => s.nome);
  const escolha = prompt(`Mover "${f.nome}" para qual setor?\n\n${nomes.map((n,i)=>`${i+1}. ${n}`).join("\n")}\n\nDigite o número:`);
  if(escolha === null) return;
  const idx = parseInt(escolha, 10) - 1;
  if(isNaN(idx) || idx < 0 || idx >= nomes.length){ toast("Opção inválida.", "error"); return; }
  f.setor = nomes[idx];
  registrarHistorico(f.nome, `moveu para o setor ${nomes[idx]}`);
  salvarBanco();
  renderizarFerramentasDoSetor(document.getElementById("idSetorOriginal").value);
  mostrarTudo();
  toast(`Movida para "${nomes[idx]}".`, "success");
}

function salvarSetor(){
  const nomeOriginal = document.getElementById("idSetorOriginal").value;
  const nome = document.getElementById("nomeSetor").value.trim();
  const obs = document.getElementById("obsSetor").value.trim();
  if(!nome){ toast("Digite o nome do setor.", "error"); return; }

  const duplicado = setores.find(s => s.nome.toLowerCase() === nome.toLowerCase() && s.nome !== nomeOriginal);
  if(duplicado){ toast("Já existe um setor com esse nome.", "warning"); return; }

  if(nomeOriginal){
    if(nome !== nomeOriginal){
      ferramentas.forEach(f => { if(f.setor === nomeOriginal) f.setor = nome; });
      manutencoes.forEach(m => { if(m.setor === nomeOriginal) m.setor = nome; });
      ativos.forEach(a => { if(a.setor === nomeOriginal) a.setor = nome; });
      ativosCriados.forEach(c => { if(c.setor === nomeOriginal) c.setor = nome; });
      pedidosMateriais.forEach(p => { if(p.setor === nomeOriginal) p.setor = nome; });
      foraDaEmpresa.forEach(f => { if(f.setor === nomeOriginal) f.setor = nome; });
      registrarHistorico(nomeOriginal, `renomeou setor para "${nome}"`);
      document.getElementById("idSetorOriginal").value = nome;
    } else {
      registrarHistorico(nome, "atualizou setor");
    }
    const idx = setores.findIndex(s => s.nome === nomeOriginal);
    if(idx >= 0) setores[idx] = { nome, observacoes: obs };
  } else {
    setores.push({ nome, observacoes: obs });
    registrarHistorico(nome, "criou novo setor");
    document.getElementById("idSetorOriginal").value = nome;
    document.getElementById("tituloSetor").textContent = "📍 Editar Setor";
    renderizarFerramentasDoSetor(nome);
  }
  salvarBanco();
  atualizarSelectsSetores();
  mostrarTudo();
  toast("Setor salvo!", "success");
}

function excluirSetor(){
  const nomeOriginal = document.getElementById("idSetorOriginal").value;
  if(!nomeOriginal) return;
  const destino = document.getElementById("moverParaSetor").value;
  if(!destino){ toast("Não há outro setor para receber os itens.", "error"); return; }

  const total = ferramentas.filter(f=>f.setor===nomeOriginal).length
    + manutencoes.filter(m=>m.setor===nomeOriginal).length
    + ativos.filter(a=>a.setor===nomeOriginal).length
    + ativosCriados.filter(c=>c.setor===nomeOriginal).length
    + pedidosMateriais.filter(p=>p.setor===nomeOriginal).length
    + foraDaEmpresa.filter(f=>f.setor===nomeOriginal).length;

  if(!confirm(total > 0 ? `Excluir "${nomeOriginal}"?\n\n${total} item(ns) irão para "${destino}".` : `Excluir "${nomeOriginal}"?`)) return;

  ferramentas.forEach(f => { if(f.setor === nomeOriginal) f.setor = destino; });
  manutencoes.forEach(m => { if(m.setor === nomeOriginal) m.setor = destino; });
  ativos.forEach(a => { if(a.setor === nomeOriginal) a.setor = destino; });
  ativosCriados.forEach(c => { if(c.setor === nomeOriginal) c.setor = destino; });
  pedidosMateriais.forEach(p => { if(p.setor === nomeOriginal) p.setor = destino; });
  foraDaEmpresa.forEach(f => { if(f.setor === nomeOriginal) f.setor = destino; });
  setores = setores.filter(s => s.nome !== nomeOriginal);
  registrarHistorico(nomeOriginal, `excluiu setor — ${total} item(ns) → "${destino}"`);
  salvarBanco();
  atualizarSelectsSetores();
  fecharSetor();
  mostrarTudo();
  toast("Setor excluído.", "success");
}

/* ============ FERRAMENTAS ============ */
function mostrarFerramentas(){
  const el = document.getElementById("listaFerramentas");
  if(!el) return;
  const pesquisa = (document.getElementById("pesquisaFerramenta")?.value||"").toLowerCase();
  let lista = ferramentas.filter(x=>(x.nome+" "+x.codigo+" "+x.setor).toLowerCase().includes(pesquisa));

  if(filtroAtualFerramenta === "disponivel") lista = lista.filter(x=>x.status==="Disponível");
  else if(filtroAtualFerramenta === "emprestada") lista = lista.filter(x=>x.status==="Emprestada");
  else if(filtroAtualFerramenta === "manutencao") lista = lista.filter(x=>x.status==="Manutenção");
  else if(filtroAtualFerramenta === "atrasada"){
    lista = lista.filter(x=>{
      if(x.status !== "Emprestada") return false;
      const a = alarmes.find(al=>al.ferramentaId===x.id && al.ativo);
      if(!a) return false;
      return new Date(a.dataLimite).getTime() < Date.now();
    });
  }

  if(!lista.length){
    el.innerHTML = `<div class="card empty-state"><span class="emoji">🔍</span><span>Nenhuma ferramenta encontrada.</span></div>`;
    return;
  }

  el.innerHTML = lista.map(x=>{
    const sc = x.status==="Disponível"?"badge-success":x.status==="Emprestada"?"badge-warning":"badge-manutencao";
    const foto = x.fotos?.[0] ? `<img class="imagem-mini" src="${x.fotos[0]}">` : `<div class="imagem-placeholder">🔧</div>`;
    const qtd = (x.quantidade && x.quantidade > 1) ? `<span class="badge badge-qtd">📦 Qtd: ${x.quantidade}</span>` : '';
    const alarme = alarmes.find(a=>a.ferramentaId===x.id && a.ativo);
    let tempoRestante = '', tempoClass = '';
    if(alarme){
      const diff = new Date(alarme.dataLimite).getTime() - Date.now();
      if(diff <= 0){ tempoRestante = '🔴 Atrasado!'; tempoClass = 'badge-tempo urgente'; }
      else {
        const h = Math.floor(diff/(1000*60*60));
        const m = Math.floor((diff%(1000*60*60))/(1000*60));
        tempoRestante = `⏱️ ${h}h ${m}min`;
        tempoClass = h < 6 ? 'badge-tempo urgente' : 'badge-tempo';
      }
    }
    return `
      <div class="card item">
        ${foto}
        <div class="item-info">
          <div class="nome">${escapar(x.nome)}</div>
          <div class="detalhes">Código: ${escapar(x.codigo||"-")}<br>Setor: ${escapar(x.setor)}</div>
          <div class="tags">
            <span class="badge ${sc}">${escapar(x.status)}</span>
            ${qtd}
            ${alarme ? `<span class="badge ${tempoClass}">${tempoRestante}</span>` : ''}
          </div>
        </div>
        <div class="item-actions">
          <button type="button" onclick="abrirHistoricoItem('ferramenta','${x.id}')" aria-label="Histórico">📜</button>
          <button type="button" onclick="abrirFerramenta('${x.id}')" aria-label="Editar">✏️</button>
          <button type="button" onclick="compartilharFerramenta('${x.id}')" aria-label="Compartilhar">📲</button>
          ${x.status === 'Emprestada' ? `<button type="button" onclick="devolverFerramenta('${x.id}')" aria-label="Devolver">✅</button>` : ''}
          <button type="button" onclick="excluirFerramenta('${x.id}')" aria-label="Excluir">🗑️</button>
        </div>
      </div>
    `;
  }).join("");
}

function abrirFerramenta(id=null){
  midiasFerramenta = [];
  document.getElementById("idFerramenta").value = id||"";
  if(id){
    const x = ferramentas.find(f=>f.id===id);
    if(!x) return;
    document.getElementById("tituloFerramenta").textContent = "✏️ Editar ferramenta";
    document.getElementById("nomeFerramenta").value = x.nome;
    document.getElementById("codigoFerramenta").value = x.codigo||"";
    document.getElementById("quantidadeFerramenta").value = x.quantidade || 1;
    document.getElementById("setorFerramenta").value = x.setor;
    document.getElementById("statusFerramenta").value = x.status;
    document.getElementById("obsFerramenta").value = x.observacoes||"";
    (x.fotos||[]).forEach(f=>midiasFerramenta.push({tipo:"foto",src:f}));
  } else {
    document.getElementById("tituloFerramenta").textContent = "📦 Cadastrar ferramenta";
    document.getElementById("nomeFerramenta").value = "";
    document.getElementById("codigoFerramenta").value = "";
    document.getElementById("quantidadeFerramenta").value = 1;
    document.getElementById("setorFerramenta").value = setores[0]?.nome || "";
    document.getElementById("statusFerramenta").value = "Disponível";
    document.getElementById("obsFerramenta").value = "";
  }
  mostrarPreviewFerramenta();
  document.getElementById("dialogFerramenta").showModal();
}
function fecharFerramenta(){ document.getElementById("dialogFerramenta").close(); }

function salvarFerramenta(){
  const nome = document.getElementById("nomeFerramenta").value.trim();
  if(!nome){ toast("Digite o nome.", "error"); return; }

  const id = document.getElementById("idFerramenta").value || gerarId();
  const status = document.getElementById("statusFerramenta").value;
  const setor = document.getElementById("setorFerramenta").value;
  const anterior = ferramentas.find(f=>f.id===id)?.status;
  const ehEdicao = !!document.getElementById("idFerramenta").value;
  let codigo = document.getElementById("codigoFerramenta").value.trim();

  if(codigo){
    const dupCod = ferramentas.find(f =>
      f.id !== (ehEdicao ? id : null) &&
      String(f.codigo||'').trim().toLowerCase() === codigo.toLowerCase()
    );
    if(dupCod){
      toast(`⚠️ Código "${dupCod.codigo}" já usado por "${dupCod.nome}".`, "warning");
      return;
    }
  }

  const dupNomeSetor = ferramentas.find(f =>
    f.id !== (ehEdicao ? id : null) &&
    String(f.nome||'').trim().toLowerCase() === nome.toLowerCase() &&
    String(f.setor||'').trim().toLowerCase() === setor.toLowerCase()
  );
  if(dupNomeSetor){
    toast(`⚠️ "${dupNomeSetor.nome}" já existe neste setor.`, "warning");
    return;
  }

  if(!codigo) codigo = gerarCodigo("FER");
  const quantidade = parseInt(document.getElementById("quantidadeFerramenta").value) || 1;

  const f = {
    id, nome, codigo, quantidade,
    setor,
    status,
    observacoes: document.getElementById("obsFerramenta").value.trim(),
    fotos: midiasFerramenta.filter(m=>m.tipo==="foto").map(m=>m.src),
    dataEmprestimo: status==="Emprestada" ? new Date().toISOString() : null,
    dataCriacao: new Date().toISOString()
  };

  const existe = ferramentas.find(x=>x.id===id);
  if(existe){
    ferramentas = ferramentas.map(x=>x.id===id?f:x);
    registrarHistorico(nome,"editou ferramenta");
    if(status==="Emprestada" && anterior!=="Emprestada") iniciarAlarme(f);
    if(status!=="Emprestada" && anterior==="Emprestada") pararAlarme(id);
  } else {
    ferramentas.push(f);
    registrarHistorico(nome,"cadastrou ferramenta");
    if(status==="Emprestada") iniciarAlarme(f);
  }
  salvarBanco();
  fecharFerramenta();
  mostrarTudo();
  toast("Ferramenta salva!", "success");
}

function excluirFerramenta(id){
  const x = ferramentas.find(f=>f.id===id);
  if(!x) return;
  if(confirm(`Excluir "${x.nome}"?`)){
    if(x.status==="Emprestada") pararAlarme(id);
    ferramentas = ferramentas.filter(f=>f.id!==id);
    registrarHistorico(x.nome,"excluiu ferramenta");
    salvarBanco();
    mostrarTudo();
    toast("Ferramenta excluída.", "success");
  }
}

async function adicionarFotos(arquivos){
  for(const a of [...arquivos]){

      const r = new FileReader();
      r.onload = function(){ res(this.result); };
      r.readAsDataURL(a);
    });
    // ✅ Comprime antes de guardar
    const comprimida = await comprimirImagem(dataUrl);
    midiasFerramenta.push({tipo:"foto", src: comprimida});
  }
  mostrarPreviewFerramenta();
}

    descricao: document.getElementById("descricaoManutencao").value.trim(),
    solucao: document.getElementById("solucaoManutencao").value.trim(),
    fotos: midiasManutencao.filter(x=>x.tipo==="foto").map(x=>x.src),
    arquivos: midiasManutencao.filter(x=>x.tipo==="arquivo").map(x=>({nome:x.nome,src:x.src})),
    dataCadastro: new Date().toISOString()
  };
  const existe = manutencoes.find(x=>x.id===id);
  if(existe){
    manutencoes = manutencoes.map(x=>x.id===id?m:x);
    registrarHistorico(nome,"editou manutenção");
  } else {
    manutencoes.push(m);
    registrarHistorico(nome,"cadastrou manutenção");
  }
  salvarBanco();
  fecharManutencao();
  mostrarTudo();
  toast("Manutenção salva!", "success");
}

function mostrarManutencoes(){
  const el = document.getElementById("listaManutencoes");
  if(!el) return;
  const pesquisa = (document.getElementById("pesquisaManutencao")?.value||"").toLowerCase();
  let lista = manutencoes.filter(x=>(x.nome+" "+x.codigo+" "+x.setor+" "+x.responsavel).toLowerCase().includes(pesquisa));

  if(filtroAtualManutencao === "aberta") lista = lista.filter(x=>x.status==="Aguardando análise"||x.status==="Aguardando peça");
  else if(filtroAtualManutencao === "andamento") lista = lista.filter(x=>x.status==="Em andamento"||x.status==="Em teste");
  else if(filtroAtualManutencao === "peca") lista = lista.filter(x=>x.status==="Aguardando peça");
  else if(filtroAtualManutencao === "finalizada") lista = lista.filter(x=>x.status==="Finalizada"||x.status==="Sem conserto");

  if(!lista.length){
    el.innerHTML = `<div class="card empty-state"><span class="emoji">🧰</span><span>Nenhuma manutenção encontrada.</span></div>`;

  el.innerHTML = lista.slice().reverse().map(x=>{

    const statusClass = x.status==="Finalizada"?"badge-success":x.status==="Sem conserto"?"badge-danger":x.status==="Aguardando peça"?"badge-warning":"badge-info";
    const foto = x.fotos?.[0] ? `<img class="imagem-mini" src="${x.fotos[0]}">` : `<div class="imagem-placeholder">🧰</div>`;
    const arquivosInfo = x.arquivos?.length ? `<br>📎 ${x.arquivos.length} arquivo(s)` : '';
    return `
      <div class="card item" style="border-color:rgba(255,107,130,0.25);">
        ${foto}
        <div class="item-info">
          <div class="nome">🧰 ${escapar(x.nome)}</div>
          <div class="detalhes">
            Código: ${escapar(x.codigo||"-")}<br>
            Setor: ${escapar(x.setor)}<br>
            Tipo: ${escapar(x.tipo)}<br>
            Responsável: ${escapar(x.responsavel||"-")}<br>
            Entrada: ${x.dataEntrada ? new Date(x.dataEntrada).toLocaleDateString("pt-BR") : "-"}
            ${arquivosInfo}
          </div>
          <div class="tags">
            <span class="badge ${statusClass}">${escapar(x.status)}</span>
            <span class="badge ${prioClass}">${escapar(x.prioridade)}</span>
            ${x.custo ? `<span class="badge badge-pedido">💰 R$ ${escapar(x.custo)}</span>` : ''}
          </div>
        </div>
        <div class="item-actions">
          <button type="button" onclick="abrirManutencao('${x.id}')" aria-label="Editar">✏️</button>
          <button type="button" onclick="gerarPDFManutencaoItem('${x.id}')" aria-label="PDF">📄</button>
          <button type="button" onclick="excluirManutencao('${x.id}')" aria-label="Excluir">🗑️</button>
        </div>
      </div>
    `;
  }).join("");
}
function excluirManutencao(id){
  const m = manutencoes.find(x=>x.id===id);
  if(!m) return;
  if(confirm(`Excluir manutenção de "${m.nome}"?`)){
    manutencoes = manutencoes.filter(x=>x.id!==id);
    registrarHistorico(m.nome,"excluiu manutenção");
    salvarBanco();
    mostrarTudo();
    toast("Manutenção excluída.", "success");
  }
}

function mostrarLoadingOCR(){

function cancelarOCR(){
  removerLoadingOCR();

}
function atualizarProgressoOCR(m){
  const barra = document.getElementById('progressoOCRBarra');
  const texto = document.getElementById('progressoOCRTexto');
  const status = document.getElementById('progressoOCRStatus');
  if(!barra) return;
  if(m.status === 'loading tesseract core'){ status.textContent = 'Baixando motor OCR...'; }
  else if(m.status === 'loading language traineddata'){ status.textContent = 'Baixando idioma português...'; }
  else if(m.status === 'initializing api'){ status.textContent = 'Inicializando...'; }
  else if(m.status === 'recognizing text'){
    status.textContent = 'Reconhecendo texto...';
    const pct = Math.round(m.progress * 100);
    barra.style.width = pct + '%';
    texto.textContent = pct + '%';
  }
}
function removerLoadingOCR(){
  const el = document.getElementById('ocrLoading');
  if(el) el.remove();
}

async function processarOCR(arquivo){
  if(!arquivo){ toast("Nenhum arquivo selecionado.", "error"); return; }
  if(typeof Tesseract === 'undefined'){
    toast("Biblioteca OCR não carregou. Verifique sua internet.", "error");
    return;
  }

  mostrarLoadingOCR();

  const reader = new FileReader();
  reader.onload = async () => {
    const comprimida = await comprimirImagem(reader.result, 1600, 0.85);
    midiasFora.push({ tipo:'foto', src: comprimida, nome:'OS_' + Date.now() + '.jpg' });
    mostrarPreviewFora();
  };
  reader.readAsDataURL(arquivo);

  try {
    const resultado = await Tesseract.recognize(arquivo, 'por', {
      logger: m => atualizarProgressoOCR(m)
    });
    const textoBruto = resultado.data.text;
    console.log('📄 Texto OCR bruto:\n', textoBruto);

    const dados = extrairDadosOS(textoBruto);
    console.log('📦 Dados extraídos:', dados);

    preencherFormularioFora(dados);
    removerLoadingOCR();
    mostrarResultadoOCR(dados, textoBruto);
    toast("OS lida com sucesso!", "success");
  } catch(e){
    console.error(e);
    removerLoadingOCR();
    toast("Erro ao ler OS: " + e.message, "error");
  }
}

function extrairDadosOS(texto){
  const t = texto.replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/[“”"']/g,'').trim();
  const linhas = t.split('\n').map(l => l.trim()).filter(l => l.length > 0);

  const dados = { os:'', empresa:'', cnpj:'', ie:'', dataEntrada:'', endereco:'', bairro:'',
    cidade:'', telefone:'', email:'', atendente:'', tecnico:'', nfEntrada:'',
    equipamento:'', marca:'', modelo:'', codigo:'', tipoAssist:'', notaFiscal:'',
    defeito:'', observacoes:'', garantia:'', fornecedorGarantia:'', acessorios:'' };

  function pegarDepois(pattern, fonte = t){
    const regex = new RegExp(pattern + '\\s*:?\\s*([^\\n]+?)(?=\\s{2,}|\\n|$)', 'i');
    const m = fonte.match(regex);
    return m ? m[1].trim().replace(/\s+$/,'') : '';
  }

  const mOS = t.match(/N[º°o\.\s]*Ordem\s*Servi[çc]o\s*:?\s*(\d+)/i) || t.match(/Ordem\s*Servi[çc]o\s*:?\s*(\d+)/i) || t.match(/O\.?S\.?\s*:?\s*(\d{3,})/i);
  if(mOS) dados.os = mOS[1];

  const mCNPJ = t.match(/CNPJ\s*:?\s*(\d{2}\.?\d{3}\.?\d{3}\/?\d{4}\-?\d{2})/i);
  if(mCNPJ) dados.cnpj = mCNPJ[1].replace(/\D/g,'');

  const mIE = t.match(/\bIE\s*:?\s*(\d{8,12})/i);
  if(mIE) dados.ie = mIE[1];

  const mData = t.match(/Data\s*entrada\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i) || t.match(/(\d{2}\/\d{2}\/\d{4})/);
  if(mData){ const [d,mo,a] = mData[1].split('/'); dados.dataEntrada = `${a}-${mo}-${d}`; }

  const mGarantia = t.match(/Dta\s*Garan\s*:?\s*(\d{2}\/\d{2}\/\d{4})/i);
  if(mGarantia){ const [d,mo,a] = mGarantia[1].split('/'); dados.garantia = `${a}-${mo}-${d}`; }

  dados.endereco = pegarDepois('Endere[çc]o');
  dados.bairro = pegarDepois('Bairro');
  dados.cidade = pegarDepois('Cidade');

  const mTel = t.match(/(?:Celular|Fone|Telefone)\s*:?\s*([\d\s\-\(\)]{8,})/i);
  if(mTel) dados.telefone = mTel[1].replace(/\s+/g,' ').trim();

  const mEmail = t.match(/E-?mail\s*:?\s*([^\s]+@[^\s]+)/i);
  if(mEmail) dados.email = mEmail[1];

  dados.atendente = pegarDepois('Atendente');
  dados.tecnico = pegarDepois('T[ée]cnico');
  dados.nfEntrada = pegarDepois('N[º°o\.\s]*NF\\s*Entrada') || pegarDepois('NF\\s*Entrada');
  dados.equipamento = pegarDepois('Equipamento');
  dados.marca = pegarDepois('Marca');
  dados.modelo = pegarDepois('Modelo');
  dados.codigo = pegarDepois('Ferramenta');
  dados.tipoAssist = pegarDepois('Tipo\\s*Assist');
  dados.notaFiscal = pegarDepois('Nota\\s*Fiscal');
  dados.fornecedorGarantia = pegarDepois('Fornec\\s*Garant');
  dados.acessorios = pegarDepois('Acess[óo]rios');
  dados.defeito = pegarDepois('Defeito');
  dados.observacoes = pegarDepois('\\bObs\\b');

  const idxOS = linhas.findIndex(l => /ordem\s*servi[çc]o/i.test(l));
  if(idxOS >= 0){
    for(let i = idxOS+1; i < Math.min(idxOS+5, linhas.length); i++){
      const l = linhas[i];
      if(/LTDA|S\/A|EIRELI|\bME\b|\bEPP\b|SERVICE|MANUTEN[ÇC][ÃA]O|COM[ÉE]RCIO|IND[ÚU]STRIA/i.test(l)){
        dados.empresa = l.replace(/[^\w\s\.\-\/&áéíóúâêîôûãõçÁÉÍÓÚÂÊÎÔÛÃÕÇ]/g,'').trim();
        break;
      }
    }
  }
  return dados;
}

function preencherFormularioFora(d){
  const nomeComposto = [d.equipamento, d.marca, d.modelo].filter(Boolean).join(' ').trim();
  if(nomeComposto){ const el = document.getElementById('nomeFora'); if(el) el.value = nomeComposto; }
  if(d.codigo){ const el = document.getElementById('codigoFora'); if(el && !el.value) el.value = d.codigo; }
  if(d.empresa){ const el = document.getElementById('empresaFora'); if(el) el.value = d.empresa; }
  const contatos = [];
  if(d.cnpj) contatos.push('CNPJ: ' + d.cnpj);
  if(d.ie) contatos.push('IE: ' + d.ie);
  if(d.telefone) contatos.push(d.telefone);
  if(contatos.length){ const el = document.getElementById('contatoFora'); if(el) el.value = contatos.join(' • '); }
  if(d.tecnico){ const el = document.getElementById('responsavelEmpresaFora'); if(el) el.value = d.tecnico; }
  if(d.atendente){ const el = document.getElementById('responsavelFora'); if(el) el.value = d.atendente; }
  if(d.os){ const el = document.getElementById('osFora'); if(el) el.value = d.os; }
  if(d.dataEntrada){ const el = document.getElementById('dataSaidaFora'); if(el) el.value = d.dataEntrada; }
  if(d.notaFiscal){ const el = document.getElementById('notaFiscalFora'); if(el) el.value = d.notaFiscal; }

  // ✅ FIX: OCR — só usa "Garantia" em tipoAssistFora, tipoServicoFora só recebe valores válidos
  if(d.tipoAssist){
    const t = d.tipoAssist.toUpperCase();
    const elServ = document.getElementById('tipoServicoFora');
    if(elServ){
      if(t.includes('MECANICA') || t.includes('MECÂNICA')) elServ.value = 'Reparo mecânico';
      else if(t.includes('ELETRICA') || t.includes('ELÉTRICA')) elServ.value = 'Reparo elétrico';
      else if(t.includes('RETIFICA')) elServ.value = 'Retífica';
      else if(t.includes('CALIBRA')) elServ.value = 'Calibração';
      else if(t.includes('SOLDA')) elServ.value = 'Solda';
      else if(t.includes('USINAGEM')) elServ.value = 'Usinagem';
      else if(t.includes('PINTURA')) elServ.value = 'Pintura';
      else if(t.includes('PREVENTIVA')) elServ.value = 'Manutenção preventiva';
      // "Garantia" é tipoAssist, não tipoServico — deixa o padrão
    }
    const elAssist = document.getElementById('tipoAssistFora');
    if(elAssist){
      if(t.includes('GARANTIA')) elAssist.value = 'Garantia';
      else if(t.includes('PARTICULAR')) elAssist.value = 'Particular';
      else if(t.includes('CONTRATO')) elAssist.value = 'Contrato';
      else if(t.includes('SEGURO')) elAssist.value = 'Seguro';
      else if(t.includes('ORÇAMENTO') || t.includes('ORCAMENTO')) elAssist.value = 'Orçamento';
    }
  }

  const descPartes = [];
  if(d.defeito && d.defeito.length > 2) descPartes.push('Defeito: ' + d.defeito);
  if(d.acessorios && d.acessorios.length > 2 && d.acessorios.toUpperCase() !== 'ND') descPartes.push('Acessórios: ' + d.acessorios);
  if(descPartes.length){ const el = document.getElementById('descricaoFora'); if(el && !el.value) el.value = descPartes.join('\n'); }

  const obsPartes = [];
  if(d.observacoes && d.observacoes.length > 2) obsPartes.push(d.observacoes);
  if(d.endereco) obsPartes.push('Endereço: ' + d.endereco + (d.bairro ? ' - ' + d.bairro : '') + (d.cidade ? ', ' + d.cidade : ''));
  if(obsPartes.length){ const el = document.getElementById('obsFora'); if(el && !el.value) el.value = obsPartes.join('\n'); }
}

/* ============ NFC-e ============ */
function abrirScannerNFCe(){
  if(!window.Html5Qrcode){ toast("Leitor de QR não disponível.", "error"); return; }
  document.getElementById('dialogScannerNFCe').showModal();
  scannerNFCe = new Html5Qrcode("readerNFCe");
  scannerNFCe.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    (texto) => { const url = texto.trim(); fecharScannerNFCe(); processarURLNFCe(url); },
    () => {}
  ).catch(err => { toast("Erro no scanner: " + err, "error"); fecharScannerNFCe(); });
}
function fecharScannerNFCe(){
  if(scannerNFCe){
    try {
      scannerNFCe.stop().then(()=>{ scannerNFCe.clear(); scannerNFCe = null; }).catch(()=>{ scannerNFCe = null; });
    } catch(e){ scannerNFCe = null; }
  }
  const dlg = document.getElementById('dialogScannerNFCe');
  if(dlg && dlg.open) dlg.close();
}

function processarURLNFCe(url){
  const dados = { chave:'', emitente:'', cnpjEmitente:'', valor:'', data:'', uf:'', serie:'', numero:'', urlOriginal:url };
  try {
    const u = new URL(url);
    const paramP = u.searchParams.get('p');
    if(paramP){
      const partes = paramP.split('|');
      if(partes[0] && partes[0].length === 44){
        const chave = partes[0];
        dados.chave = chave;
        dados.uf = chave.substring(0,2);
        const ano = chave.substring(2,4);
        const mes = chave.substring(4,6);
        const anoFull = parseInt(ano) > 50 ? '19'+ano : '20'+ano;
        dados.data = `${anoFull}-${mes}`;
        dados.cnpjEmitente = chave.substring(6,20);
        dados.serie = chave.substring(22,25);
        dados.numero = chave.substring(25,34);
      }
    }
  } catch(e){ console.warn('URL inválida', e); }
  mostrarResultadoNFCe(dados, url);
}

function mostrarResultadoNFCe(dados, url){
  const el = document.getElementById('resultadoOCR');
  if(!el) return;
  el.className = 'resultado-ocr';
  el.style.display = 'block';

  const campos = [
    ['Chave NFC-e', dados.chave || '(não identificada)'],
    ['UF', dados.uf ? mapearUF(dados.uf) : ''],
    ['CNPJ Emitente', dados.cnpjEmitente || ''],
    ['Série', dados.serie || ''],
    ['Número', dados.numero || ''],
    ['Data aprox.', dados.data || '']
  ].filter(c => c[1]);

  el.innerHTML = `
    <div class="titulo">
      <span>🧾 QR Code NFC-e lido</span>
      <button type="button" onclick="fecharResultadoOCR()" style="padding:4px 12px;font-size:11px;border-radius:20px;background:rgba(255,255,255,0.08);border:1px solid var(--borda);color:var(--texto);cursor:pointer;">✕ Fechar</button>
    </div>
    <div class="grid-campos">
      ${campos.map(c => `<div class="campo"><span class="muted" style="opacity:0.7;">${c[0]}:</span> <b>${escapar(String(c[1]))}</b></div>`).join('')}
    </div>
    <div class="text-sm" style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(45,219,122,0.2);opacity:0.8;">
      💡 A chave foi extraída. Complete os campos manualmente ou use o OCR da foto da nota para mais detalhes.
    </div>
    <div class="acoes" style="margin-top:10px;">
      <button type="button" class="btn-primary" onclick="aplicarDadosNFCe()">✅ Aplicar dados no formulário</button>
      <button type="button" class="btn-outline" onclick="window.open('${escapar(url)}','_blank')">🌐 Abrir consulta SEFAZ</button>
    </div>
  `;
  window._ultimosDadosNFCe = dados;
}

function mapearUF(codigo){
  const map = { '11':'RO','12':'AC','13':'AM','14':'RR','15':'PA','16':'AP','17':'TO','21':'MA','22':'PI','23':'CE','24':'RN','25':'PB','26':'PE','27':'AL','28':'SE','29':'BA','31':'MG','32':'ES','33':'RJ','35':'SP','41':'PR','42':'SC','43':'RS','50':'MS','51':'MT','52':'GO','53':'DF' };
  return map[codigo] || codigo;
}

function aplicarDadosNFCe(){
  const d = window._ultimosDadosNFCe;
  if(!d) return;
  if(d.cnpjEmitente){
    const el = document.getElementById('contatoFora');
    if(el){
      const atual = el.value;
      if(!atual || !atual.includes(d.cnpjEmitente)) el.value = (atual ? atual + ' • ' : '') + 'CNPJ: ' + d.cnpjEmitente;
    }
  }
  if(d.chave){
    const el = document.getElementById('notaFiscalFora');
    if(el && !el.value) el.value = 'NFC-e ' + (d.serie ? 'S' + d.serie + ' ' : '') + (d.numero ? 'Nº ' + d.numero : '');
  }
  if(d.data && d.data.length === 7){
    const hoje = new Date();
    const [a, m] = d.data.split('-');
    if(parseInt(a) === hoje.getFullYear() && parseInt(m) === (hoje.getMonth()+1)){
      const el = document.getElementById('dataSaidaFora');
      if(el && !el.value) el.value = hoje.toISOString().substring(0,10);
    }
  }
  if(d.uf){
    const el = document.getElementById('obsFora');
    if(el && !el.value.includes('UF:')) el.value = (el.value ? el.value + '\n' : '') + 'UF emitente: ' + mapearUF(d.uf);
  }
  toast("Dados da NFC-e aplicados!", "success");
}

function abrirForaDaEmpresa(id=null){
  midiasFora = [];
  document.getElementById("idFora").value = id||"";
  const hoje = new Date().toISOString().substring(0,10);
  const elResOCR = document.getElementById('resultadoOCR');
  if(elResOCR){ elResOCR.style.display = 'none'; elResOCR.innerHTML = ''; }

  if(id){
    const x = foraDaEmpresa.find(f=>f.id===id);
    if(!x) return;
    document.getElementById("tituloFora").textContent = "✏️ Editar Assistência Técnica";
    document.getElementById("nomeFora").value = x.nome;
    document.getElementById("codigoFora").value = x.codigo||"";
    document.getElementById("tipoFora").value = x.tipo||"Ferramenta";
    document.getElementById("quantidadeFora").value = x.quantidade||1;
    document.getElementById("empresaFora").value = x.empresa||"";
    document.getElementById("contatoFora").value = x.contato||"";
    document.getElementById("responsavelEmpresaFora").value = x.responsavelEmpresa||"";
    document.getElementById("responsavelFora").value = x.responsavel||"";
    document.getElementById("setorFora").value = x.setor||setores[0]?.nome;
    document.getElementById("tipoServicoFora").value = x.tipoServico||"Reparo mecânico";
    const elAssist = document.getElementById('tipoAssistFora');
    if(elAssist) elAssist.value = x.tipoAssist || '';
    document.getElementById("prioridadeFora").value = x.prioridade||"Média";
    document.getElementById("dataSaidaFora").value = x.dataSaida||hoje;
    document.getElementById("dataRetornoFora").value = x.dataRetorno||"";
    document.getElementById("statusFora").value = x.status||"Enviado";
    document.getElementById("osFora").value = x.os||"";
    document.getElementById("valorFora").value = x.valor||"";
    document.getElementById("notaFiscalFora").value = x.notaFiscal||"";
    document.getElementById("descricaoFora").value = x.descricao||"";
    document.getElementById("solucaoFora").value = x.solucao||"";
    document.getElementById("obsFora").value = x.observacoes||"";
    document.getElementById("dataHoraRetornoFora").value = x.dataHoraRetorno||"";
    document.getElementById("recebedorFora").value = x.recebedor||"";
    (x.fotos||[]).forEach(f=>midiasFora.push({tipo:"foto",src:f}));
    (x.videos||[]).forEach(v=>midiasFora.push({tipo:"video",src:v}));
    (x.arquivos||[]).forEach(a=>midiasFora.push({tipo:"arquivo",nome:a.nome,src:a.src}));
  } else {
    document.getElementById("tituloFora").textContent = "☠️ Nova Assistência Técnica";
    ["nomeFora","codigoFora","empresaFora","contatoFora","responsavelEmpresaFora","responsavelFora","dataRetornoFora","osFora","valorFora","notaFiscalFora","descricaoFora","solucaoFora","obsFora","dataHoraRetornoFora","recebedorFora"].forEach(i => { const el = document.getElementById(i); if(el) el.value = ""; });
    document.getElementById("tipoFora").value = "Ferramenta";
    document.getElementById("quantidadeFora").value = 1;
    document.getElementById("setorFora").value = setores[0]?.nome || "";
    document.getElementById("tipoServicoFora").value = "Reparo mecânico";
    const elAssistNovo = document.getElementById('tipoAssistFora');
    if(elAssistNovo) elAssistNovo.value = '';
    document.getElementById("prioridadeFora").value = "Média";
    document.getElementById("dataSaidaFora").value = hoje;
    document.getElementById("statusFora").value = "Enviado";
  }
  mostrarPreviewFora();
  document.getElementById("dialogForaDaEmpresa").showModal();
}
function fecharForaDaEmpresa(){ document.getElementById("dialogForaDaEmpresa").close(); }

async function adicionarFotosFora(arquivos){
  for(const a of [...arquivos]){
    const dataUrl = await new Promise(res => {
      const r = new FileReader();
      r.onload = function(){ res(this.result); };
      r.readAsDataURL(a);
    });
    const comprimida = await comprimirImagem(dataUrl);
    midiasFora.push({tipo:"foto",src:comprimida,nome:a.name});
  }
  mostrarPreviewFora();
}
function adicionarVideosFora(arquivos){
  [...arquivos].forEach(a=>{
    if(a.size > 15 * 1024 * 1024){
      toast(`⚠️ Vídeo "${a.name}" é maior que 15MB. Pode estourar o armazenamento.`, "warning");
    }
    const r = new FileReader();
    r.onload = function(){ midiasFora.push({tipo:"video",src:this.result,nome:a.name}); mostrarPreviewFora(); };
    r.readAsDataURL(a);
  });
}
function adicionarArquivosFora(arquivos){
  [...arquivos].forEach(a=>{
    const r = new FileReader();
    r.onload = function(){ midiasFora.push({tipo:"arquivo",nome:a.name,src:this.result}); mostrarPreviewFora(); };
    r.readAsDataURL(a);
  });
}

function mostrarPreviewFora(){
  const el = document.getElementById("previewFora");
  el.innerHTML = midiasFora.map((m, idx)=>{
    if(m.tipo==="foto") return `<div style="position:relative;display:inline-block;"><img src="${m.src}" onclick="visualizarMidia('foto','${m.src}')" style="cursor:pointer;"><button type="button" onclick="removerMidiaFora(${idx})" style="position:absolute;top:2px;right:2px;padding:2px 6px;font-size:11px;background:rgba(255,0,0,0.8);">✕</button></div>`;
    if(m.tipo==="video") return `<div style="position:relative;display:inline-block;"><video src="${m.src}" onclick="visualizarMidia('video','${m.src}')" style="cursor:pointer;"></video><button type="button" onclick="removerMidiaFora(${idx})" style="position:absolute;top:2px;right:2px;padding:2px 6px;font-size:11px;background:rgba(255,0,0,0.8);">✕</button></div>`;
    const isPdf = m.nome?.toLowerCase().endsWith(".pdf");
    const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(m.nome||"");
    const isVid = /\.(mp4|webm|mov|avi)$/i.test(m.nome||"");
    let icone = "📎"; if(isPdf) icone = "📄"; else if(isImg) icone = "🖼️"; else if(isVid) icone = "🎥";
    return `<div class="anexo-item" style="display:inline-flex;max-width:220px;">
      <span class="icone">${icone}</span>
      <span class="nome" title="${escapar(m.nome||"")}">${escapar(m.nome||"arquivo")}</span>
      <button type="button" onclick="visualizarMidia('arquivo','${m.src}','${escapar(m.nome||"")}')">👁️</button>
      <button type="button" onclick="removerMidiaFora(${idx})">✕</button>
    </div>`;
  }).join("");
}
function removerMidiaFora(idx){ midiasFora.splice(idx,1); mostrarPreviewFora(); }

function visualizarMidia(tipo, src, nome=""){
  const c = document.getElementById("conteudoMidia");
  const t = document.getElementById("tituloMidia");
  t.textContent = nome || (tipo === "foto" ? "🖼️ Foto" : tipo === "video" ? "🎥 Vídeo" : "📎 Arquivo");
  if(tipo === "foto") c.innerHTML = `<img src="${src}" style="max-width:100%;max-height:75vh;border-radius:12px;">`;
  else if(tipo === "video") c.innerHTML = `<video src="${src}" controls style="max-width:100%;max-height:75vh;border-radius:12px;"></video>`;
  else {
    const isPdf = (nome||"").toLowerCase().endsWith(".pdf");
    const isImg = /\.(jpg|jpeg|png|gif|webp)$/i.test(nome||"");
    const isVid = /\.(mp4|webm|mov|avi)$/i.test(nome||"");
    if(isPdf) c.innerHTML = `<iframe src="${src}" style="width:100%;height:75vh;border-radius:12px;border:1px solid var(--borda);"></iframe>`;
    else if(isImg) c.innerHTML = `<img src="${src}" style="max-width:100%;max-height:75vh;border-radius:12px;">`;
    else if(isVid) c.innerHTML = `<video src="${src}" controls style="max-width:100%;max-height:75vh;border-radius:12px;"></video>`;
    else c.innerHTML = `<div style="padding:20px;"><p class="muted">Arquivo: <b>${escapar(nome||"arquivo")}</b></p><a href="${src}" download="${escapar(nome||"arquivo")}" class="btn-primary" style="display:inline-flex;text-decoration:none;padding:10px 20px;border-radius:30px;margin-top:12px;">⬇️ Baixar arquivo</a></div>`;
  }
  document.getElementById("dialogVisualizarMidia").showModal();
}

function salvarForaDaEmpresa(){
  const nome = document.getElementById("nomeFora").value.trim();
  const empresa = document.getElementById("empresaFora").value.trim();
  if(!nome){ toast("Digite o nome da ferramenta.", "error"); return; }
  if(!empresa){ toast("Digite o nome da empresa terceirizada.", "error"); return; }

  const id = document.getElementById("idFora").value || gerarId();
  let codigo = document.getElementById("codigoFora").value.trim();
  if(!codigo) codigo = gerarCodigo("FORA");
  const anterior = foraDaEmpresa.find(f=>f.id===id);
  const status = document.getElementById("statusFora").value;
  let dataHoraRetorno = document.getElementById("dataHoraRetornoFora").value;
  if(status === "Retornado" && !dataHoraRetorno){
    const agora = new Date(); agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
    dataHoraRetorno = agora.toISOString().slice(0,16);
    document.getElementById("dataHoraRetornoFora").value = dataHoraRetorno;
  }
  const tipoAssist = document.getElementById('tipoAssistFora')?.value || '';

  const f = {
    id, nome, codigo,
    tipo: document.getElementById("tipoFora").value,
    quantidade: parseInt(document.getElementById("quantidadeFora").value) || 1,
    empresa,
    contato: document.getElementById("contatoFora").value.trim(),
    responsavelEmpresa: document.getElementById("responsavelEmpresaFora").value.trim(),
    responsavel: document.getElementById("responsavelFora").value.trim(),
    setor: document.getElementById("setorFora").value,
    tipoServico: document.getElementById("tipoServicoFora").value,
    tipoAssist: tipoAssist,
    prioridade: document.getElementById("prioridadeFora").value,
    dataSaida: document.getElementById("dataSaidaFora").value,
    dataRetorno: document.getElementById("dataRetornoFora").value,
    status,
    os: document.getElementById("osFora").value.trim(),
    valor: document.getElementById("valorFora").value.trim(),
    notaFiscal: document.getElementById("notaFiscalFora").value.trim(),
    descricao: document.getElementById("descricaoFora").value.trim(),
    solucao: document.getElementById("solucaoFora").value.trim(),
    observacoes: document.getElementById("obsFora").value.trim(),
    dataHoraRetorno: dataHoraRetorno,
    recebedor: document.getElementById("recebedorFora").value.trim(),
    fotos: midiasFora.filter(m=>m.tipo==="foto").map(m=>m.src),
    videos: midiasFora.filter(m=>m.tipo==="video").map(m=>m.src),
    arquivos: midiasFora.filter(m=>m.tipo==="arquivo").map(m=>({nome:m.nome,src:m.src})),
    dataCadastro: anterior?.dataCadastro || new Date().toISOString(),
    dataAtualizacao: new Date().toISOString()
  };
  if(anterior){
    foraDaEmpresa = foraDaEmpresa.map(x=>x.id===id?f:x);
    registrarHistorico(nome, `editou assistência técnica (${empresa})`);
  } else {
    foraDaEmpresa.push(f);
    registrarHistorico(nome, `enviou para assistência técnica em "${empresa}"`);
  }
  salvarBanco();
  fecharForaDaEmpresa();
  mostrarTudo();
  toast("Assistência técnica salva!", "success");
}

function mostrarForaDaEmpresa(){
  const el = document.getElementById("listaForaDaEmpresa");
  if(!el) return;
  const total = foraDaEmpresa.length;
  const pend = foraDaEmpresa.filter(x=>!["Retornado","Cancelado","Sem conserto"].includes(x.status)).length;
  const atrasado = foraDaEmpresa.filter(x=>{
    if(["Retornado","Cancelado","Sem conserto"].includes(x.status)) return false;
    if(!x.dataRetorno) return false;
    return new Date(x.dataRetorno).getTime() < Date.now();
  }).length;
  const valorTotal = foraDaEmpresa.reduce((acc,x)=>{ const v = parseFloat((x.valor||"0").replace(",",".")); return acc + (isNaN(v) ? 0 : v); }, 0);

  const miniEl = document.getElementById("miniEstatisticasFora");
  if(miniEl){
    miniEl.innerHTML = `
      <div class="card estatistica" style="padding:14px 8px;"><span class="icon" style="font-size:22px;">☠️</span><span class="label">Total</span><strong style="font-size:26px;">${total}</strong></div>
      <div class="card estatistica" style="padding:14px 8px;"><span class="icon" style="font-size:22px;">⏳</span><span class="label">Pendentes</span><strong style="font-size:26px;">${pend}</strong></div>
      <div class="card estatistica" style="padding:14px 8px;"><span class="icon" style="font-size:22px;">⚠️</span><span class="label">Atrasados</span><strong style="font-size:26px;">${atrasado}</strong></div>
      <div class="card estatistica" style="padding:14px 8px;"><span class="icon" style="font-size:22px;">💰</span><span class="label">Valor Total</span><strong style="font-size:22px;">R$ ${valorTotal.toFixed(2)}</strong></div>
    `;
  }

  const pesquisa = (document.getElementById("pesquisaFora")?.value||"").toLowerCase();
  let lista = foraDaEmpresa.filter(x=>(x.nome+" "+x.codigo+" "+x.empresa+" "+x.responsavel+" "+(x.responsavelEmpresa||"")+" "+(x.os||"")).toLowerCase().includes(pesquisa));

  if(filtroAtualFora === "enviado") lista = lista.filter(x=>x.status==="Enviado");
  else if(filtroAtualFora === "orcamento") lista = lista.filter(x=>x.status==="Aguardando orçamento"||x.status==="Orçamento aprovado");
  else if(filtroAtualFora === "manutencao") lista = lista.filter(x=>x.status==="Em manutenção");
  else if(filtroAtualFora === "peca") lista = lista.filter(x=>x.status==="Aguardando peça");
  else if(filtroAtualFora === "pronto") lista = lista.filter(x=>x.status==="Pronto para retorno");
  else if(filtroAtualFora === "retornado") lista = lista.filter(x=>x.status==="Retornado");
  else if(filtroAtualFora === "atrasado") lista = lista.filter(x=>{
    if(["Retornado","Cancelado","Sem conserto"].includes(x.status)) return false;
    if(!x.dataRetorno) return false;
    return new Date(x.dataRetorno).getTime() < Date.now();
  });

  if(!lista.length){
    el.innerHTML = `<div class="card empty-state"><span class="emoji">☠️</span><span>Nenhuma ferramenta em assistência técnica.</span><button type="button" class="btn-fora mt-16" onclick="abrirForaDaEmpresa()">＋ Registrar assistência</button></div>`;
    return;
  }

  el.innerHTML = lista.slice().reverse().map(x=>{
    const statusClass = {
      "Enviado":"badge-fora","Aguardando orçamento":"badge-warning",
      "Orçamento aprovado":"badge-created","Em manutenção":"badge-danger",
      "Aguardando peça":"badge-warning","Pronto para retorno":"badge-created",
      "Retornado":"badge-success","Sem conserto":"badge-danger","Cancelado":"badge-danger"
    }[x.status] || "badge-info";
    const prioClass = x.prioridade==="Urgente"?"badge-danger":x.prioridade==="Alta"?"badge-warning":"badge-info";
    const foto = x.fotos?.[0] ? `<img class="imagem-mini" src="${x.fotos[0]}">` : `<div class="imagem-placeholder">☠️</div>`;

    const agora = Date.now();
    let atrasoInfo = '';
    if(x.dataRetorno && !["Retornado","Cancelado","Sem conserto"].includes(x.status)){
      const dias = Math.floor((agora - new Date(x.dataRetorno).getTime())/(1000*60*60*24));
      if(dias > 0) atrasoInfo = `<span class="badge badge-tempo urgente">⚠️ Atrasado ${dias}d</span>`;
      else { const dr = Math.abs(dias); atrasoInfo = `<span class="badge badge-tempo">📅 ${dr}d p/ retorno</span>`; }
    }

    const anexos = [];
    if(x.fotos?.length) anexos.push(`📷${x.fotos.length}`);
    if(x.videos?.length) anexos.push(`🎥${x.videos.length}`);
    if(x.arquivos?.length) anexos.push(`📎${x.arquivos.length}`);

    const botaoRetorno = x.status === "Retornado"
      ? `<button type="button" onclick="reabrirFora('${x.id}')" title="Reabrir" aria-label="Reabrir">🔄</button>`
      : `<button type="button" onclick="marcarRetornado('${x.id}')" title="Marcar retorno" aria-label="Marcar retorno">✅</button>`;

    return `
      <div class="card item" style="border-color:rgba(124,92,191,0.3);">
        ${foto}
        <div class="item-info">
          <div class="nome">☠️ ${escapar(x.nome)}</div>
          <div class="detalhes">
            Código: ${escapar(x.codigo||"-")} • Qtd: ${x.quantidade||1}<br>
            🏢 <b>${escapar(x.empresa)}</b><br>
            ${x.responsavelEmpresa?`👤 Resp. empresa: ${escapar(x.responsavelEmpresa)}<br>`:''}
            ${x.responsavel?`📤 Enviado por: ${escapar(x.responsavel)}<br>`:''}
            📍 Setor: ${escapar(x.setor)}<br>
            🔧 Serviço: ${escapar(x.tipoServico||"-")}
            ${x.tipoAssist?` • 🛡️ Assist: ${escapar(x.tipoAssist)}`:''}<br>
            📅 Saída: ${x.dataSaida?new Date(x.dataSaida).toLocaleDateString("pt-BR"):"-"}
            ${x.dataRetorno?` • Retorno: ${new Date(x.dataRetorno).toLocaleDateString("pt-BR")}`:''}
            ${x.os?`<br>📋 OS: ${escapar(x.os)}`:''}
            ${x.valor?` • 💰 R$ ${escapar(x.valor)}`:''}
            ${x.notaFiscal?`<br>🧾 NF: ${escapar(x.notaFiscal)}`:''}
            ${anexos.length?`<br>${anexos.join(" ")}`:''}
          </div>
          <div class="tags">
            <span class="badge ${statusClass}">${escapar(x.status)}</span>
            <span class="badge ${prioClass}">${escapar(x.prioridade||"Média")}</span>
            ${atrasoInfo}
          </div>
        </div>
        <div class="item-actions">
          <button type="button" onclick="abrirForaDaEmpresa('${x.id}')" title="Editar" aria-label="Editar">✏️</button>
          <button type="button" onclick="gerarPDFForaItem('${x.id}')" title="PDF" aria-label="PDF">📄</button>
          <button type="button" onclick="compartilharForaItem('${x.id}')" title="Compartilhar" aria-label="Compartilhar">📲</button>
          ${botaoRetorno}
          <button type="button" onclick="excluirForaDaEmpresa('${x.id}')" title="Excluir" aria-label="Excluir">🗑️</button>
        </div>
      </div>
    `;
  }).join("");
}

function marcarRetornado(id){
  const x = foraDaEmpresa.find(f=>f.id===id);
  if(!x) return;
  if(!confirm(`Marcar "${x.nome}" como retornado da empresa "${x.empresa}"?`)) return;
  const agora = new Date(); agora.setMinutes(agora.getMinutes() - agora.getTimezoneOffset());
  x.status = "Retornado";
  x.dataHoraRetorno = x.dataHoraRetorno || agora.toISOString().slice(0,16);
  registrarHistorico(x.nome, `marcou como retornado de "${x.empresa}"`);
  salvarBanco();
  mostrarTudo();
  toast("Marcado como retornado!", "success");
}

function reabrirFora(id){
  const x = foraDaEmpresa.find(f=>f.id===id);
  if(!x) return;
  if(!confirm(`Reabrir "${x.nome}"? Status voltará para "Em manutenção".`)) return;
  x.status = "Em manutenção";
  x.dataHoraRetorno = "";
  registrarHistorico(x.nome, "reabriu assistência técnica");
  salvarBanco();
  mostrarTudo();
  toast("Assistência reaberta.", "success");
}

function excluirForaDaEmpresa(id){
  const x = foraDaEmpresa.find(f=>f.id===id);
  if(!x) return;
  if(confirm(`Excluir envio de "${x.nome}" para "${x.empresa}"?`)){
    foraDaEmpresa = foraDaEmpresa.filter(f=>f.id!==id);
    registrarHistorico(x.nome,"excluiu assistência técnica");
    salvarBanco();
    mostrarTudo();
    toast("Assistência excluída.", "success");
  }
}

  t += `🏢 Empresa: ${x.empresa}\n`;
  if(x.contato) t += `📞 Contato: ${x.contato}\n`;
  if(x.responsavelEmpresa) t += `👤 Resp. empresa: ${x.responsavelEmpresa}\n`;
  if(x.responsavel) t += `📤 Enviado por: ${x.responsavel}\n`;
  t += `📍 Setor: ${x.setor}\n`;
  t += `🔧 Serviço: ${x.tipoServico||"-"}\n`;
  if(x.tipoAssist) t += `🛡️ Assistência: ${x.tipoAssist}\n`;
  t += `⚡ Prioridade: ${x.prioridade||"-"}\n`;
  t += `📅 Saída: ${x.dataSaida||"-"}\n`;
  if(x.dataRetorno) t += `📅 Retorno prev.: ${x.dataRetorno}\n`;
  t += `📌 Status: ${x.status}\n`;
  if(x.os) t += `📋 OS: ${x.os}\n`;
  if(x.valor) t += `💰 Valor: R$ ${x.valor}\n`;
  if(x.notaFiscal) t += `🧾 NF: ${x.notaFiscal}\n`;
  if(x.descricao) t += `\n📝 Descrição:\n${x.descricao}\n`;
  if(x.solucao) t += `\n🔧 Solução:\n${x.solucao}\n`;
  t += `\n_${new Date().toLocaleString("pt-BR")}_`;
  abrirWhatsApp(t);
}

  if(id){
    const x = ativos.find(a=>a.id===id);
    if(!x) return;
    document.getElementById("nomeAtivo").value = x.nome;
    document.getElementById("codigoAtivo").value = x.codigo||"";
    document.getElementById("tipoAtivo").value = x.tipo;
    document.getElementById("setorAtivo").value = x.setor;

async function adicionarFotoAtivo(a){
  if(!a) return;
  const dataUrl = await new Promise(res => {
    const r = new FileReader();
    r.onload = function(){ res(this.result); };
    r.readAsDataURL(a);
  });
  const comprimida = await comprimirImagem(dataUrl);
  midiasAtivo = [{tipo:"foto",src:comprimida}];
  mostrarPreviewAtivo();
}

function salvarAtivo(){
  const nome = document.getElementById("nomeAtivo").value.trim();
  if(!nome){ toast("Digite o nome.", "error"); return; }
  const id = document.getElementById("idAtivo").value || gerarId();
  const ehEdicao = !!document.getElementById("idAtivo").value;
  const setor = document.getElementById("setorAtivo").value;
  let codigo = document.getElementById("codigoAtivo").value.trim();

  // ✅ Validação de duplicata
  if(codigo){
    const dup = ativos.find(a =>
      a.id !== (ehEdicao ? id : null) &&
      String(a.codigo||'').trim().toLowerCase() === codigo.toLowerCase()
    );
    if(dup){
      toast(`⚠️ TAG "${dup.codigo}" já usada por "${dup.nome}".`, "warning");
      return;
    }
  }
  const dupNomeSetor = ativos.find(a =>
    a.id !== (ehEdicao ? id : null) &&
    String(a.nome||'').trim().toLowerCase() === nome.toLowerCase() &&
    String(a.setor||'') === setor
  );
  if(dupNomeSetor){
    toast(`⚠️ Já existe ativo "${dupNomeSetor.nome}" neste setor.`, "warning");
    return;
  }

  if(!codigo) codigo = gerarCodigo("AT");
  const a = {
    id, nome, codigo,
    tipo: document.getElementById("tipoAtivo").value,
    setor,
    status: document.getElementById("statusAtivo").value,
    observacoes: document.getElementById("obsAtivo").value.trim(),
    fotos: midiasAtivo.filter(m=>m.tipo==="foto").map(m=>m.src),
    dataCriacao: new Date().toISOString()
  };
  const existe = ativos.find(x=>x.id===id);
  if(existe){
    ativos = ativos.map(x=>x.id===id?a:x);
    registrarHistorico(nome,"editou ativo");
  } else {
    ativos.push(a);
    registrarHistorico(nome,"cadastrou ativo");
  }
  salvarBanco();
  fecharAtivo();
  mostrarTudo();
  toast("Ativo salvo!", "success");
}

/* ============ CÂMERA (WEBCAM) ============ */
async function abrirCamera(destino="ferramenta"){
  cameraDestino = destino;
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    document.getElementById("camera").srcObject = cameraStream;
    document.getElementById("dialogCamera").showModal();
  }catch(e){
    toast("Não foi possível acessar a câmera. Verifique permissões.", "error");
  }
}
function fecharCamera(){
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
  const dlg = document.getElementById("dialogCamera");
  if(dlg && dlg.open) dlg.close();
}

async function tirarFoto(){
  const v = document.getElementById("camera");
  const c = document.createElement("canvas");
  c.width = v.videoWidth; c.height = v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  const dataUrl = c.toDataURL("image/jpeg",0.85);
  const comprimida = await comprimirImagem(dataUrl);

  if(cameraDestino==="ferramenta"){ midiasFerramenta.push({tipo:"foto",src:comprimida}); mostrarPreviewFerramenta(); }
  else if(cameraDestino==="ativo"){ midiasAtivo = [{tipo:"foto",src:comprimida}]; mostrarPreviewAtivo(); }
  else if(cameraDestino==="manutencao"){ midiasManutencao.push({tipo:"foto",src:comprimida}); mostrarPreviewManutencao(); }
  else if(cameraDestino==="foradaempresa"){ midiasFora.push({tipo:"foto",src:comprimida,nome:`foto_${Date.now()}.jpg`}); mostrarPreviewFora(); }
  fecharCamera();
}

/* ============ SCANNER (FERRAMENTA) ============ */
function abrirScanner(){
  if(!window.Html5Qrcode){ toast("Leitor de código não disponível.", "error"); return; }
  document.getElementById("dialogScanner").showModal();
  scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 250 } },
    (textoDecodificado) => {
      const f = ferramentas.find(x => x.codigo && x.codigo.toLowerCase() === textoDecodificado.toLowerCase().trim());
      if(f){ fecharScanner(); abrirFerramenta(f.id); }
      else { toast(`Nenhuma ferramenta com código "${textoDecodificado}".`, "warning"); }
    },
    () => {}
  ).catch(err => { toast("Erro no scanner: " + err, "error"); fecharScanner(); });
}
function fecharScanner(){
  if(scanner){
    try {
      scanner.stop().then(()=>{ scanner.clear(); scanner = null; }).catch(()=>{ scanner = null; });
    } catch(e){ scanner = null; }
  }
  const dlg = document.getElementById("dialogScanner");
  if(dlg && dlg.open) dlg.close();
}

/* ============ PDF ============ */
function checkPDF(){
  if(!window.jspdf || !window.jspdf.jsPDF){ toast("Biblioteca PDF não carregada.", "error"); return false; }
  return true;
}
function cabecalhoPDF(doc, titulo, sub=""){
  const w = doc.internal.pageSize.getWidth();
  doc.setFillColor(13,42,61); doc.rect(0,0,w,35,'F');
  doc.setFillColor(30,184,201); doc.rect(0,33,w,2,'F');
  doc.setTextColor(255,255,255); doc.setFontSize(20); doc.setFont(undefined,'bold');
  doc.text(titulo,14,18);
  if(sub){ doc.setFontSize(10); doc.setFont(undefined,'normal'); doc.setTextColor(176,200,217); doc.text(sub,14,27); }
  doc.setFontSize(9); doc.setTextColor(176,200,217);
  doc.text(`Gerado em: ${new Date().toLocaleString('pt-BR')}`, w-14, 18, {align:'right'});
  if(usuarioAtual){ doc.setFontSize(8); doc.setTextColor(176,200,217); doc.text(`Usuário: ${usuarioAtual}`, w-14, 27, {align:'right'}); }
  const h = doc.internal.pageSize.getHeight();
  doc.setDrawColor(200,200,200); doc.line(14,h-15,w-14,h-15);
  doc.setFontSize(8); doc.setTextColor(120,120,120);
  doc.text('PCM de Ferramentas', 14, h-8);
  doc.text(`Página ${doc.internal.getCurrentPageInfo().pageNumber}`, w-14, h-8, {align:'right'});
}
async function salvarPDF(doc, nome){
  let blob;
  try { blob = doc.output("blob"); } catch(e){ console.error(e); toast("Erro ao gerar PDF.", "error"); return; }
  const file = new File([blob], nome, { type: "application/pdf" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: nome, text: "📄 Relatório — PCM de Ferramentas" }); return; }
    catch (err) { if (err.name === "AbortError") return; console.warn(err); }
  }
  try {
    const url = URL.createObjectURL(blob);
    const w = window.open(url, "_blank");
    if (!w) {
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      document.body.appendChild(a); a.click();
      setTimeout(() => { try{ document.body.removeChild(a); }catch(e){} }, 2000);
    }
    setTimeout(() => { try { URL.revokeObjectURL(url); } catch(e){} }, 60000);
  } catch(e){ console.error(e); toast("Não foi possível abrir o PDF.", "error"); }
}
