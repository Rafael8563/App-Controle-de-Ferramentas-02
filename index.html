/* ============ COMPARTILHAR IMAGEM ============ */
function compartilharRelatorioImagem(){
  const canvas = document.createElement("canvas");
  const w = 800, h = 1100;
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, "#0a1a2e"); grad.addColorStop(1, "#0d2a3d");
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = "#1eb8c9"; ctx.fillRect(0,0,w,8);
  ctx.fillStyle = "#ffffff"; ctx.font = "bold 36px sans-serif"; ctx.fillText("RELATÓRIO", 40, 70);
  ctx.font = "16px sans-serif"; ctx.fillStyle = "#b0c8d9";
  ctx.fillText(`PCM de Ferramentas • ${new Date().toLocaleString('pt-BR')}`, 40, 100);
  ctx.strokeStyle = "rgba(255,255,255,0.1)";
  ctx.beginPath(); ctx.moveTo(40, 120); ctx.lineTo(w-40, 120); ctx.stroke();
  const dados = [
    ["Ferramentas", ferramentas.length, "#1eb8c9"],
    ["Disponíveis", ferramentas.filter(x=>x.status==="Disponível").length, "#2ddb7a"],
    ["Emprestadas", ferramentas.filter(x=>x.status==="Emprestada").length, "#ffd14a"],
    ["Manutenções", manutencoes.length, "#ff6b82"],
    ["Assistência Técnica", foraDaEmpresa.length, "#7c5cbf"],
    ["Ativos", ativos.length, "#7c5cbf"],
    ["Criados", ativosCriados.length, "#2ddb7a"],
    ["Pedidos", pedidosMateriais.length, "#f5a623"]
  ];
  let y = 180;
  dados.forEach(d=>{
    ctx.fillStyle = d[2]; ctx.beginPath(); ctx.arc(55, y-6, 10, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px sans-serif"; ctx.fillText(d[0], 80, y);
    ctx.fillStyle = d[2]; ctx.font = "bold 32px sans-serif"; ctx.textAlign = "right";
    ctx.fillText(String(d[1]), w-60, y+5); ctx.textAlign = "left";
    y += 70;
  });
  canvas.toBlob(blob => {
    const file = new File([blob], `relatorio_${Date.now()}.png`, {type: "image/png"});
    if(navigator.share && navigator.canShare && navigator.canShare({files: [file]})){
      navigator.share({ files: [file], title: "PCM de Ferramentas" }).catch(()=>{ baixarBlob(blob); });
    } else { baixarBlob(blob); }
  }, "image/png");
}
function baixarBlob(blob){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `relatorio_${Date.now()}.png`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ============ ALARMES ============ */
function iniciarAlarme(f){
  const agora = new Date();
  const limite = new Date(agora.getTime() + 24*60*60*1000);
  alarmes = alarmes.filter(a=>a.ferramentaId!==f.id);
  alarmes.push({
    id: gerarId(), ferramentaId: f.id, nome: f.nome, codigo: f.codigo,
    dataEmprestimo: agora.toISOString(), dataLimite: limite.toISOString(),
    ativo: true, notificado24h:false, notificado12h:false, notificado6h:false,
    notificado1h:false, notificadoExpirado:false
  });
  salvarBanco();
  verificarAlarmes();
}

function pararAlarme(fid){
  alarmes = alarmes.filter(a=>a.ferramentaId!==fid);
  salvarBanco();
  atualizarBadgeAlarme();
}

function verificarAlarmes(){
  const agora = new Date();
  let alterou = false;
  alarmes.forEach(a=>{
    if(!a.ativo) return;
    const diff = new Date(a.dataLimite).getTime() - agora.getTime();
    const horas = diff/(1000*60*60);
    if(diff<=0 && !a.notificadoExpirado){ a.notificadoExpirado=true; alterou=true; mostrarNotificacaoAlarme(a,'expirado'); }
    else if(horas<=1 && horas>0 && !a.notificado1h){ a.notificado1h=true; alterou=true; mostrarNotificacaoAlarme(a,'1h'); }
    else if(horas<=6 && horas>1 && !a.notificado6h){ a.notificado6h=true; alterou=true; mostrarNotificacaoAlarme(a,'6h'); }
    else if(horas<=12 && horas>6 && !a.notificado12h){ a.notificado12h=true; alterou=true; mostrarNotificacaoAlarme(a,'12h'); }
    else if(horas<=24 && horas>12 && !a.notificado24h){ a.notificado24h=true; alterou=true; mostrarNotificacaoAlarme(a,'24h'); }
  });
  if(alterou) salvarBanco();
  atualizarBadgeAlarme();
  atualizarBadgeFora();
}

function mostrarNotificacaoAlarme(a, tipo){
  const c = document.getElementById('alarmeContainer');
  if(!c) return;
  const n = document.createElement('div');
  n.className = 'alarme-notificacao';
  if(tipo==='expirado') n.classList.add('urgente');
  const msgs = {'24h':'Prazo de 24h!','12h':'Restam 12h!','6h':'Restam 6h!','1h':'URGENTE 1h!','expirado':'EXPIRADO!'};
  const emojis = {'24h':'⏰','12h':'⏰','6h':'⚠️','1h':'🚨','expirado':'❌'};
  n.innerHTML = `
    <div class="alarme-header"><div>
      <div class="alarme-titulo">${emojis[tipo]} ${msgs[tipo]}</div>
      <div class="alarme-detalhes"><strong>${escapar(a.nome)}</strong>${a.codigo?` (${escapar(a.codigo)})`:''}<br>Prazo: ${new Date(a.dataLimite).toLocaleString('pt-BR')}</div>
    </div></div>
    <div class="alarme-acoes">
      <button type="button" onclick="devolverFerramenta('${a.ferramentaId}')">✅ Devolver</button>
      <button type="button" onclick="this.closest('.alarme-notificacao').remove()">✕</button>
    </div>`;
  c.appendChild(n);
  if(tipo!=='expirado') setTimeout(()=>{ if(n.parentNode) n.remove(); }, 30000);
  if("Notification" in window && Notification.permission === "granted"){
    try { new Notification(`${emojis[tipo]} ${msgs[tipo]}`, { body: `${a.nome}${a.codigo?` (${a.codigo})`:''}` }); } catch(e){}
  }
}

function devolverFerramenta(id){
  const f = ferramentas.find(x=>x.id===id);
  if(!f) return;
  if(confirm(`Devolver "${f.nome}"?`)){
    f.status = 'Disponível'; f.dataEmprestimo = null;
    salvarBanco(); pararAlarme(id);
    registrarHistorico(f.nome,'devolveu ferramenta');
    mostrarTudo();
    document.querySelectorAll('.alarme-notificacao').forEach(n=>n.remove());
    toast("Ferramenta devolvida!", "success");
  }
}

function atualizarBadgeAlarme(){
  const count = alarmes.filter(a=>a.ativo).length;
  const btn = document.querySelector('[data-tela="ferramentas"]');
  if(btn){ if(count>0){ btn.classList.add('alarme-badge'); btn.dataset.count = count; } else { btn.classList.remove('alarme-badge'); btn.dataset.count='0'; } }
}

function atualizarBadgeFora(){
  const count = foraDaEmpresa.filter(x=>!["Retornado","Cancelado","Sem conserto"].includes(x.status)).length;
  const btn = document.querySelector('[data-tela="foradaempresa"]');
  if(btn){ if(count>0){ btn.classList.add('fora-badge'); btn.dataset.count = count; } else { btn.classList.remove('fora-badge'); btn.dataset.count='0'; } }
}

/* ============ BACKUP ============ */
function exportarBackup(){
  const dados = {
    versao: "2.5",
    gerado: new Date().toISOString(),
    usuario: usuarioAtual || "—",
    ferramentas, manutencoes, ativos, ativosCriados, pedidosMateriais,
    manutencoesExternas, foraDaEmpresa, historico, alarmes, setores, contadores
  };
  const json = JSON.stringify(dados, null, 2);
  const blob = new Blob([json], {type: "application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `backup_pcm_ferramentas_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  registrarHistorico("Sistema", "exportou backup completo");
  toast("Backup exportado!", "success");
}

function importarBackup(arquivo){
  if(!arquivo) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const dados = JSON.parse(e.target.result);
      if(!dados.versao && !dados.ferramentas){ toast("Arquivo inválido.", "error"); return; }
      if(!confirm("⚠️ Isso vai SUBSTITUIR todos os dados atuais. Continuar?")) return;
      ferramentas = dados.ferramentas || [];
      manutencoes = dados.manutencoes || [];
      ativos = dados.ativos || [];
      ativosCriados = dados.ativosCriados || [];
      pedidosMateriais = dados.pedidosMateriais || [];
      manutencoesExternas = dados.manutencoesExternas || [];
      foraDaEmpresa = dados.foraDaEmpresa || [];
      historico = dados.historico || [];
      alarmes = dados.alarmes || [];
      setores = dados.setores || SETORES_PADRAO.map(n => ({nome:n, observacoes:""}));
      contadores = dados.contadores || {FER:0,AT:0,CR:0,PED:0,EXT:0,MAN:0,FORA:0};
      registrarHistorico("Sistema", `importou backup`);
      salvarBanco();
      atualizarSelectsSetores();
      mostrarTudo();
      toast("Backup restaurado!", "success");
    }catch(err){ toast("Erro: " + err.message, "error"); }
  };

}

/* ============ WHATSAPP ============ */
function copiarTexto(t){
  return new Promise((resolve) => {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(resolve).catch(() => {
        const ta = document.createElement("textarea");
        ta.value = t; ta.style.position = "fixed"; ta.style.left = "-9999px";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch(e){}
        ta.remove(); resolve();
      });
    } else {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch(e){}
      ta.remove(); resolve();
    }
  });
}

function abrirWhatsApp(t){
  if (navigator.share) {
    navigator.share({ text: t }).catch((err) => {
      if (err.name !== "AbortError") copiarTexto(t).then(() => toast("Texto copiado!", "success"));
    });
    return;
  }
  copiarTexto(t).then(() => toast("Texto copiado!", "success"));
}

  abrirWhatsApp(texto);
}

/* ============ PWA ============ */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault(); deferredPrompt = e;
  if(document.getElementById('btnInstalarApp')) return;
  const b = document.createElement('button');
  b.type = 'button';
  b.id = 'btnInstalarApp';
  b.innerHTML = '📲 Instalar App';
  document.body.appendChild(b);
  b.onclick = async ()=>{ if(deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; b.remove(); } };
});
window.addEventListener('appinstalled', ()=>{ const b = document.getElementById('btnInstalarApp'); if(b) b.remove(); });

function solicitarNotificacoes(){
  if("Notification" in window && Notification.permission === "default") Notification.requestPermission();
}

/* ============ SERVICE WORKER ============ */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const swCode = `
    const CACHE = "pcm-ferramentas-v8";
    const ARQUIVOS = [
      "./",
      "https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js",
      "https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js",
      "https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js",
      "https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js",
      "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"
    ];
    self.addEventListener("install", e => { e.waitUntil(caches.open(CACHE).then(c => c.addAll(ARQUIVOS)).then(() => self.skipWaiting())); });
    self.addEventListener("activate", e => { e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim())); });
    self.addEventListener("fetch", e => {
      if (e.request.method !== "GET") return;
      e.respondWith(caches.match(e.request).then(cached => {
        if (cached) return cached;
        return fetch(e.request).then(resp => {
          if (resp.ok && new URL(e.request.url).origin === location.origin) {
            const clone = resp.clone();
            caches.open(CACHE).then(c => c.put(e.request, clone));
          }
          return resp;
        }).catch(() => cached);
      }));
    });
  `;
  const blob = new Blob([swCode], {type: "application/javascript"});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).then(()=>console.log('✅ SW registrado')).catch(e=>console.log('SW:', e));
}
